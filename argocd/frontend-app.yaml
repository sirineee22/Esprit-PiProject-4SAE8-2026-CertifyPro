apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: certifypro-frontend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sirineee22/Esprit-PiProject-4SAE8-2026-CertifyPro.git
    targetRevision: main
    path: k8s
    directory:
      include: "frontend-deployment.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: certifypro

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
