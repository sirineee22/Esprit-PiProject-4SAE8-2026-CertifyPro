name: User Service CI

on:
  push:
    branches:
      - sirine-devops
      - main
    paths:
      - 'backend/services/user-service/**'
      - '.github/workflows/user-service-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/services/user-service/**'
      - '.github/workflows/user-service-ci.yml'

jobs:
  build-and-test:
    name: Build & Test User Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: userdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, coverage and SonarCloud analysis
        working-directory: backend/services/user-service
        run: |
          mvn verify sonar:sonar \
            -Dspring.profiles.active=test \
            -Dsonar.projectKey=sirineee22_Esprit-PiProject-4SAE8-2026-CertifyPro \
            -Dsonar.organization=sirineee22 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          DB_URL: jdbc:postgresql://localhost:5432/userdb
          DB_USERNAME: postgres
          DB_PASSWORD: testpassword
          JWT_SECRET: test-secret-min-32-chars-for-testing-only
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-service-test-results
          path: backend/services/user-service/target/surefire-reports/
