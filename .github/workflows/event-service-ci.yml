name: Event Service CI

on:
  push:
    branches:
      - sirine-devops
      - main
    paths:
      - 'backend/services/event-service/**'
      - '.github/workflows/event-service-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/services/event-service/**'
      - '.github/workflows/event-service-ci.yml'

jobs:
  build-and-test:
    name: Build & Test Event Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, coverage and SonarCloud analysis
        working-directory: backend/services/event-service
        run: |
          mvn verify sonar:sonar \
            -Dspring.profiles.active=test \
            -Dsonar.projectKey=sirineee22_Esprit-PiProject-4SAE8-2026-CertifyPro \
            -Dsonar.organization=sirineee22 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          JWT_SECRET: test-secret-min-32-chars-for-testing-only
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-service-test-results
          path: backend/services/event-service/target/surefire-reports/
