name: Event Service CI

on:
  push:
    branches:
      - sirine-devops
      - main
    paths:
      - 'backend/services/event-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/services/event-service/**'

jobs:
  build-and-test:
    name: Build & Test Event Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend/services/event-service
        run: mvn test -Dspring.profiles.active=test
        env:
          JWT_SECRET: test-secret-min-32-chars-for-testing-only

      - name: Build JAR (skip tests)
        working-directory: backend/services/event-service
        run: mvn package -DskipTests

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-service-test-results
          path: backend/services/event-service/target/surefire-reports/
