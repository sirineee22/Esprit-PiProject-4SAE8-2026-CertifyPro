name: Event Service CI

on:
  push:
    branches:
      - sirine-devops
      - main
    paths:
      - 'backend/services/event-service/**'
      - '.github/workflows/event-service-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/services/event-service/**'
      - '.github/workflows/event-service-ci.yml'

jobs:
  build-and-test:
    name: Build & Test Event Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with coverage
        working-directory: backend/services/event-service
        run: mvn test jacoco:report -Dspring.profiles.active=test
        env:
          JWT_SECRET: test-secret-min-32-chars-for-testing-only

      - name: Build JAR (skip tests)
        working-directory: backend/services/event-service
        run: mvn package -DskipTests

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-service-test-results
          path: backend/services/event-service/target/surefire-reports/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend/services/event-service
