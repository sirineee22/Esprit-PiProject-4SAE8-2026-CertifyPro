name: CI — Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, develop, feature/** ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — job-careers-service (Spring Boot + PostgreSQL)
  # ─────────────────────────────────────────────────────────────────────────
  job-careers-tests:
    name: job-careers-service tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test --no-transfer-progress
        working-directory: backend/services/job-careers-service

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-careers-test-report
          path: backend/services/job-careers-service/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — messaging-service (Spring Boot + MongoDB)
  # ─────────────────────────────────────────────────────────────────────────
  messaging-tests:
    name: messaging-service tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test --no-transfer-progress
        working-directory: backend/services/messanging-service

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messaging-test-report
          path: backend/services/messanging-service/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Angular frontend build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Angular build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build (production)
        run: npx ng build --configuration production
        working-directory: frontend
