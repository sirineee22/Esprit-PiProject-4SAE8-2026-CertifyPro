name: CI/CD Pipeline - Sprint 01

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and Test with Maven
        working-directory: backend/services/user-service
        run: mvn clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
          JWT_SECRET: test-secret-min-32-chars-for-testing-only
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_tests_only
          OPENAI_API_KEY: dummy-key-for-tests
          EUREKA_CLIENT_ENABLED: "false"

  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Run Unit Tests
        working-directory: frontend
        run: npx vitest run
        
      - name: Build Production
        working-directory: frontend
        run: npm run build
