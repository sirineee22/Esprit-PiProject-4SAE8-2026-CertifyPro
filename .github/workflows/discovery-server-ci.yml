name: Discovery Server CI

on:
  push:
    branches:
      - sirine-devops
      - main
    paths:
      - 'backend/discovery-server/**'
      - '.github/workflows/discovery-server-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/discovery-server/**'
      - '.github/workflows/discovery-server-ci.yml'

jobs:
  build-and-test:
    name: Build & Test Discovery Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: backend/discovery-server
        run: mvn verify

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-server-test-results
          path: backend/discovery-server/target/surefire-reports/
