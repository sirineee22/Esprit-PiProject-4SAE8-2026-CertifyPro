name: Discovery Server CD

on:
  push:
    branches:
      - sirine-devops
      - main
    paths:
      - 'backend/discovery-server/**'
      - '.github/workflows/discovery-server-cd.yml'

jobs:
  deploy:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push discovery-server image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/discovery-server
          file: ./backend/discovery-server/Dockerfile
          push: true
          tags: |
            siriinaa2233/certifypro-discovery-server:latest
            siriinaa2233/certifypro-discovery-server:${{ github.sha }}
