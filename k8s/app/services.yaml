apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: certifypro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: certifypro-user:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8883
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/userdb
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              value: postgres
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: certifypro
spec:
  selector:
    app: user-service
  ports:
    - port: 8883
      targetPort: 8883
---
