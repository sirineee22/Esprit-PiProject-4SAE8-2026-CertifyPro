apiVersion: v1
kind: Namespace
metadata:
  name: certifypro

---
# ============================================
# Deployment
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collaboration-service
  namespace: certifypro
  labels:
    app: collaboration-service
    version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collaboration-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: collaboration-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: collaboration-service
          image: certifypro/collaboration-service:latest
          ports:
            - containerPort: 8085
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-server:8761/eureka/"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: collaboration-db-secret
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: collaboration-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: collaboration-db-secret
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

---
# ============================================
# Service (ClusterIP)
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: collaboration-service
  namespace: certifypro
  labels:
    app: collaboration-service
spec:
  type: ClusterIP
  selector:
    app: collaboration-service
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
      name: http
