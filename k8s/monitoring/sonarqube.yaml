apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: certifypro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      containers:
        - name: sonarqube
          image: sonarqube:community
          ports:
            - containerPort: 9000
          env:
            - name: SONAR_JDBC_URL
              value: jdbc:postgresql://postgres:5432/sonardb
            - name: SONAR_JDBC_USERNAME
              value: postgres
            - name: SONAR_JDBC_PASSWORD
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: certifypro
spec:
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
