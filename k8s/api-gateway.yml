apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: certifypro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: esprit-piproject-4sae8-2026-certifypro-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: certifypro-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: certifypro-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: certifypro
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8081
      targetPort: 8081
  type: NodePort
