server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
        add-to-simple-url-handler-mapping: true
      discovery:
        locator:
          enabled: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # ================= USER =================
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**,/api/roles/**,/api/admin/audit/**
        - id: payments-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: auth-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: certifications-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/certifications/**,/api/certifications
        - id: certification-exams-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/certification-exams/**,/api/certification-exams
        - id: certification-attempts-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/certification-attempts/**
        - id: ai-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/ai/**

        # ================= PLANNED SESSION =================
        - id: trainer-requests-service
          uri: lb://PLANNED-SESSION-SERVICE
          predicates:
            - Path=/api/trainer-requests/**
        - id: planned-session-service
          uri: lb://PLANNED-SESSION-SERVICE
          predicates:
            - Path=/api/schedules/**
        - id: room-service
          uri: lb://PLANNED-SESSION-SERVICE
          predicates:
            - Path=/api/rooms/**

        # ================= FORUM =================
        - id: forum-service
          uri: lb://FORUM-SERVICE
          predicates:
            - Path=/api/forum/**,/uploads/posts/**

        # ================= ECOMMERCE =================
        - id: ecommerce-service
          uri: lb://ECOMMERCE-SERVICE
          predicates:
            - Path=/api/products/**,/api/orders/**

        # ================= EVENTS =================
        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/api/events/**,/api/admin/events/**

        # ================= TRAINING =================
        - id: evaluations-service
          uri: lb://TRAINING-SERVICE
          predicates:
            - Path=/api/evaluations/**,/api/evaluations
        - id: formations-service
          uri: lb://TRAINING-SERVICE
          predicates:
            - Path=/api/formations/**,/api/formations
        - id: quizzes-service
          uri: lb://TRAINING-SERVICE
          predicates:
            - Path=/api/quizzes/**,/api/quizzes
        - id: progression-service
          uri: lb://TRAINING-SERVICE
          predicates:
            - Path=/api/progression/**,/api/progression
        - id: favorites-service
          uri: lb://TRAINING-SERVICE
          predicates:
            - Path=/api/favorites/**,/api/favorites
        - id: stats-service
          uri: lb://TRAINING-SERVICE
          predicates:
            - Path=/api/stats/**,/api/stats

        # ================= COLLABORATION =================
        - id: collaboration-service
          uri: lb://COLLABORATION-SERVICE
          predicates:
            - Path=/api/groups/**

        # ================= JOBS =================
        - id: job-careers-service
          uri: lb://JOB-CAREERS-SERVICE
          predicates:
            - Path=/api/jobs/**,/api/companies/**,/api/files/**,/api/candidate/**,/api/admin/applications/**,/api/admin/statistics/**,/api/categories/**,/api/employer/**

        # ================= MESSAGING — REST =================
        - id: messaging-service-rest
          uri: lb://MESSAGING-SERVICE
          predicates:
            - Path=/api/chat/**
        - id: messaging-service-uploads
          uri: lb://MESSAGING-SERVICE
          predicates:
            - Path=/uploads/**
        - id: messaging-service-notifications
          uri: lb://MESSAGING-SERVICE
          predicates:
            - Path=/api/notifications/**

        # ================= WEBSOCKET =================
        - id: messaging-service-ws
          uri: lb:ws://MESSAGING-SERVICE
          predicates:
            - Path=/ws-chat/**
          filters:
            - RewritePath=/ws-chat/(?<segment>.*), /ws-chat/${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

logging:
  level:
    reactor.core.publisher.Operators: OFF
    reactor.netty: WARN
    io.netty: WARN
    org.springframework.cloud.gateway: INFO
