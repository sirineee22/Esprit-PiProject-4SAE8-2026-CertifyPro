version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8081:8081"
    depends_on:
      - discovery-server

  user-service:
    build: ./services/user-service
    ports:
      - "8883:8883"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped

  training-service:
    build: ./services/training-service
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped

  event-service:
    build: ./services/event-service
    ports:
      - "8884:8884"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eventdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped

  ecommerce-service:
    build: ./services/ecommerce
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped

  forum-service:
    build: ./services/forum_service
    ports:
      - "8087:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/forumdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped

  collaboration-service:
    build: ./services/collaboration-service
    ports:
      - "8088:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped

  planned-session-service:
    build: ./services/planned-session-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - discovery-server
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    ports:
      - "9001:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonardb
      SONAR_JDBC_USERNAME: postgres
      SONAR_JDBC_PASSWORD: postgres
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  sonarqube-data:
  sonarqube-logs:
