server.port=8085
spring.application.name=messaging-service

spring.data.mongodb.uri=mongodb://localhost:27017/messaging_db

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

jwt.secret=${JWT_SECRET:dev-secret-min-32-chars-for-local-only}

app.upload.dir=uploads
app.base-url=http://localhost:8080

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

logging.level.org.springframework=INFO
logging.level.com.esprit.pi=DEBUG
# ✅ Supprime les faux-positifs "Connection reset by peer" sur déconnexion WebSocket
logging.level.reactor.core.publisher.Operators=OFF
logging.level.reactor.netty=WARN
logging.level.io.netty=WARN

spring.profiles.active=dev

# ── Giphy API (GIF picker) ───────────────────────────────
# Replace with your own key from https://developers.giphy.com/
giphy.api.key=${GIPHY_API_KEY:dc6zaTOxFJmzC}

# ===== Actuator + Prometheus (Monitoring) =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
