# ===== Serveur =====
server.port=8089

# ===== Nom du service pour Eureka =====
spring.application.name=job-careers-service

# ===== Base de donnees PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/job_db
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Eureka =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=job-careers-service
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===== JWT =====
jwt.secret=${JWT_SECRET:dev-secret-min-32-chars-for-local-only}
jwt.expiration=86400000

# ===== Uploads =====
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Logs =====
logging.level.org.springframework=INFO
logging.level.com.esprit.pi=DEBUG

# ===== Discovery =====
spring.cloud.discovery.enabled=true
eureka.client.enabled=true

# ===== Inter-service URLs =====
user-service.url=http://localhost:8083

# ===== Profile =====
spring.profiles.active=dev

# ===== Actuator + Prometheus (Monitoring) =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
