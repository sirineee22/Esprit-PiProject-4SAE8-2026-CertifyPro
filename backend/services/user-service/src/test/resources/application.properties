# ── Test datasource (H2 in-memory, no PostgreSQL needed) ──────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Disable Eureka (no discovery server in CI) ─────────────────────────────
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# ── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=test-secret-min-32-chars-for-testing-only
jwt.expiration=86400000

# ── Mail (fake SMTP — avoids connection attempt) ───────────────────────────
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── Stripe (dummy key for tests) ───────────────────────────────────────────
stripe.secret-key=sk_test_dummy_key_for_tests_only

# ── OpenAI (disabled in tests) ────────────────────────────────────────────
openai.api.key=dummy-key-for-tests

# ── Multipart ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.profile-dir=uploads/profile
app.frontend-origin=http://localhost:4200
