# In-memory H2 database for tests — no real PostgreSQL needed
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Eureka during tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable mail during tests
spring.mail.host=localhost
spring.mail.port=3025
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# JWT
jwt.secret=test-secret-min-32-chars-for-testing
jwt.expiration=86400000

# Disable multipart limits warning
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
